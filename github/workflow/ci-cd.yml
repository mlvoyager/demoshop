name: CI-CD pipeline
on:
  push:
    branches:
      - main
jobs:
   test:
    runs-on: ubuntu-Latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      
